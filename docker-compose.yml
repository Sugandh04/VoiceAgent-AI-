version: "3.9"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  VoiceAgent AI — Docker Compose (Production-grade)
#
#  Services:
#    api     — FastAPI + Uvicorn (HTTP + WebSocket)
#    worker  — LiveKit Voice Agent worker process (separate from API)
#    db      — MySQL 8.0 (persistent volume)
#    redis   — Redis 7 (caching + pub/sub for live dashboard)
#    nginx   — Reverse proxy + SSL termination
#
#  Usage:
#    docker compose up --build          # Start all services
#    docker compose up api worker       # Start without nginx (dev)
#    docker compose logs -f api         # Follow API logs
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

services:

  # ── FastAPI Application Server ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: voiceagent-api
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=mysql+aiomysql://voiceagent:${MYSQL_PASSWORD:-voiceagent123}@db:3306/voiceagent
      - REDIS_URL=redis://redis:6379/0
      - ENV=production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - voiceagent_uploads:/app/uploads
    networks:
      - voiceagent-net

  # ── LiveKit Voice Agent Worker ────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: voiceagent-worker
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=mysql+aiomysql://voiceagent:${MYSQL_PASSWORD:-voiceagent123}@db:3306/voiceagent
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - voiceagent-net

  # ── MySQL 8.0 Database ────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: voiceagent-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass123}
      MYSQL_DATABASE: voiceagent
      MYSQL_USER: voiceagent
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-voiceagent123}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "voiceagent", "-pvoiceagent123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - voiceagent-net

  # ── Redis 7 (Cache + Pub/Sub) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: voiceagent-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - voiceagent-net

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: voiceagent-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - voiceagent-net

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  voiceagent_uploads:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  voiceagent-net:
    driver: bridge

